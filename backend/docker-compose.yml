# Starter compose for the API. Mamoon extends this with the worker and final settings.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://sigapp:sigapp@postgres:5432/sigdb
      REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # worker:   # Farhan's Celery worker goes here (same image or its own Dockerfile)
  #   build: ./worker
  #   env_file: .env
  #   depends_on: [redis, postgres]

  redis:
    image: redis:7-alpine

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sigapp
      POSTGRES_PASSWORD: sigapp
      POSTGRES_DB: sigdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigapp -d sigdb"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  uploads:
  pgdata:
